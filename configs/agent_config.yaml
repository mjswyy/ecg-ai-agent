# ECG AI Agent — Configuration

llm:
  backend: "deepseek"        # deepseek | openai | vllm
  model: "deepseek-chat"     # 官方 API 模型名: deepseek-chat (V3) / deepseek-reasoner (R1)
  temperature: 0.3
  max_tokens: 2048
  # api_key 从项目根目录 .env 读取: DEEPSEEK_API_KEY=sk-xxx（.env 已被 .gitignore 忽略）
  # 也可直接设置系统环境变量 DEEPSEEK_API_KEY

agent:
  max_steps: 10
  verbose: false

tools:
  ecg:
    r_peak_method: "pan_tompkins"
    lead_for_analysis: 1       # Lead II
  classifier:
    threshold: 0.3             # Minimum probability for positive diagnosis
    top_k: 5                   # Top-N predictions to report
  anomaly:
    threshold_percentile: 95.0

reflection:
  enable_llm_verify: true      # Use LLM to verify critical findings
  hr_plausible_range: [20, 300]
  qt_plausible_range: [200, 700]   # 与 eval_agent_llm.py / reflector.py 口径一致（检查报告 1.9）
  sdnn_plausible_max: 300
  hr_cross_tool_tolerance: 20  # bpm difference threshold

pipeline:
  preprocess: true
  target_fs: 500
  target_length: 5000          # 与主协议 processed_5k 一致（旧值 4096 为遗留默认）
